name: infrastructure
on:
  workflow_dispatch:
  push:
    paths: ['backend/**', 'deploy/**', 'scripts/**', '.github/workflows/infrastructure.yaml']
  pull_request:
    paths: ['backend/**', 'deploy/**', 'scripts/**', '.github/workflows/infrastructure.yaml']
permissions:
  contents: read
concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: knowflow
      COMPOSE_PARALLEL_LIMIT: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Configure disposable deployment
        shell: python
        run: |
          import os, secrets
          from pathlib import Path
          source = Path('.env.example').read_text()
          values = {'SECRET_KEY': secrets.token_hex(32),
                    'POSTGRES_PASSWORD': secrets.token_hex(24),
                    'POSTGRES_APP_PASSWORD': secrets.token_hex(24),
                    'MINIO_ROOT_PASSWORD': secrets.token_hex(24),
                    'ALLOWED_HOSTS': 'localhost,127.0.0.1,backend,frontend',
                    'CODE_REVISION': os.environ['GITHUB_SHA'],
                    'API_USER_RATE': '100000/min'}
          for key in ['SECRET_KEY', 'POSTGRES_PASSWORD', 'POSTGRES_APP_PASSWORD', 'MINIO_ROOT_PASSWORD']:
              print('::add-mask::'+values[key])
          lines = [line for line in source.splitlines() if not any(line.startswith(key+'=') for key in values)]
          Path('.env').write_text('\n'.join(lines)+'\n'+'\n'.join(f'{key}={value}' for key,value in values.items())+'\n')
          Path('.runtime').mkdir(exist_ok=True)
      - name: Validate deployment definition
        run: docker compose --env-file .env -f deploy/compose.yaml config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and cache pinned MinIO source
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.minio
          tags: knowflow-minio:source
          load: true
          cache-from: type=gha,scope=minio-source-v1
          cache-to: type=gha,mode=min,scope=minio-source-v1
      - name: Build reproducible application images
        run: docker compose --env-file .env -f deploy/compose.yaml build backend frontend
      - name: Start clean deployment
        run: docker compose --env-file .env -f deploy/compose.yaml up -d --wait --wait-timeout 240
      - name: Exercise real queue, storage, authorization and SSE
        run: docker compose --env-file .env -f deploy/compose.yaml exec -T backend uv run --no-sync python manage.py verify_stack --report /tmp/infrastructure-report.json
      - name: Check dependency failures and recovery
        run: python scripts/verify-infrastructure.py --cycles 10
      - name: Run S5 authorization ingestion consistency and tracing acceptance
        run: docker compose --env-file .env -f deploy/compose.yaml exec -T backend uv run --no-sync python manage.py verify_delivery --disposable --output /tmp/delivery-report.json
      - name: Preserve reports before quiesced backup
        run: |
          docker compose --env-file .env -f deploy/compose.yaml exec -T backend cat /tmp/infrastructure-report.json > .runtime/infrastructure-report.json
          docker compose --env-file .env -f deploy/compose.yaml exec -T backend cat /tmp/delivery-report.json > .runtime/delivery-report.json
      - name: Interrupt and recover a real worker five times
        run: python scripts/verify-worker-recovery.py
      - name: Back up PostgreSQL and private objects and restore a new deployment
        run: |
          python scripts/deployment-backup.py backup --output "$RUNNER_TEMP/knowflow-backup.zip"
          python scripts/deployment-backup.py restore --archive "$RUNNER_TEMP/knowflow-backup.zip" --env-file .env --new-project knowflow-s5-restore --port 8081 --report .runtime/restoration-report.json
          docker compose -p knowflow-s5-restore --env-file .env -f deploy/compose.yaml exec -T backend uv run --no-sync python manage.py verify_stack --report /tmp/restored-business.json
          docker compose -p knowflow-s5-restore --env-file .env -f deploy/compose.yaml exec -T backend cat /tmp/restored-business.json > .runtime/restored-business.json
          docker compose -p knowflow-s5-restore --env-file .env -f deploy/compose.yaml stop
      - name: Measure 20-user API and 10-user hybrid retrieval for ten minutes
        run: |
          docker compose --env-file .env -f deploy/compose.yaml run --rm --no-deps --user "$(id -u):$(id -g)" --volume "$PWD/.runtime:/reports" backend uv run --no-sync python manage.py benchmark_delivery --disposable --duration 600 --min-requests 1000 --output /reports/load-report.json
      - name: Verify opt-in HTTPS with a disposable trusted certificate
        run: |
          mkdir -p "$RUNNER_TEMP/tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost -addext subjectAltName=DNS:localhost -keyout "$RUNNER_TEMP/tls/key.pem" -out "$RUNNER_TEMP/tls/cert.pem"
          TLS_CERT_FILE="$RUNNER_TEMP/tls/cert.pem" TLS_KEY_FILE="$RUNNER_TEMP/tls/key.pem" HTTPS_PORT=8443 docker compose --env-file .env -f deploy/compose.yaml -f deploy/compose.tls.yaml up -d --no-deps --wait backend frontend
          python scripts/verify-tls.py --certificate "$RUNNER_TEMP/tls/cert.pem"
      - name: Collect reports and service logs
        if: always()
        shell: bash
        run: |
          for report in infrastructure-report delivery-report load-report; do
            if docker compose --env-file .env -f deploy/compose.yaml exec -T backend cat /tmp/$report.json > .runtime/$report.json.tmp; then mv .runtime/$report.json.tmp .runtime/$report.json; fi
          done
          if docker compose --env-file .env -f deploy/compose.yaml exec -T backend cat /tmp/load-report.jsonl > .runtime/load-report.jsonl.tmp; then mv .runtime/load-report.jsonl.tmp .runtime/load-report.jsonl; fi
          docker compose --env-file .env -f deploy/compose.yaml ps -a > .runtime/containers.txt || true
          docker compose --env-file .env -f deploy/compose.yaml logs --no-color --tail 300 > .runtime/service-logs.txt 2>&1 || true
          docker compose --env-file .env -f deploy/compose.yaml images --format json > .runtime/images.json || true
          if [ "${{ job.status }}" != "success" ]; then tail -n 100 .runtime/service-logs.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrastructure-verification
          path: .runtime/
          retention-days: 14
          include-hidden-files: true
      - name: Stop disposable deployment
        if: always()
        run: |
          docker compose -p knowflow-s5-restore --env-file .env -f deploy/compose.yaml down -v --remove-orphans
          docker compose --env-file .env -f deploy/compose.yaml down -v --remove-orphans
