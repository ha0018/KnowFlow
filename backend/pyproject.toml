[project]
name = "knowflow-ai"
version = "0.1.0"
description = "Tenant-aware knowledge management and grounded AI answers"
requires-python = ">=3.12,<3.15"
dependencies = [
  "Django>=5.2.8,<5.3",
  "djangorestframework>=3.16,<3.17",
  "djangorestframework-simplejwt>=5.5,<6",
  "django-cors-headers>=4.7,<5",
  "django-environ>=0.12,<0.14",
  "django-storages[s3]>=1.14,<2",
  "celery[redis]>=5.5,<6",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<0.5",
  "uvicorn>=0.35,<1",
  "httpx>=0.28,<0.29",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "jieba>=0.42.1,<0.43",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-django>=4.11,<5", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
