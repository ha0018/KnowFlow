services:
  backend:
    environment:
      SECURE_SSL_REDIRECT: "true"
  frontend:
    ports: ["${HTTPS_PORT:-443}:443"]
    volumes:
      - ./nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_FILE:?Set TLS_CERT_FILE}:/etc/nginx/tls/cert.pem:ro
      - ${TLS_KEY_FILE:?Set TLS_KEY_FILE}:/etc/nginx/tls/key.pem:ro
