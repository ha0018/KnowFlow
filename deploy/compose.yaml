name: knowflow
x-backend: &backend
  image: knowflow-backend:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile.backend
  environment: &environment
    DJANGO_SETTINGS_MODULE: config.settings.prod
    DEBUG: "false"
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-true}
    AI_PROVIDER: ${AI_PROVIDER:-demo}
    AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
    AI_API_KEY: ${AI_API_KEY:-}
    AI_MODEL: ${AI_MODEL:-}
    AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
    EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-demo}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-demo-hash-v1}
    EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-128}
    MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-3}
    CODE_REVISION: ${CODE_REVISION:-workspace}
    DATABASE_URL: postgres://knowflow_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}@postgres:5432/knowflow
    REDIS_URL: redis://redis:6379/0
    CELERY_TASK_ALWAYS_EAGER: "false"
    S3_ENABLED: "true"
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    bucket: { condition: service_completed_successfully }
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    environment:
      POSTGRES_USER: knowflow
      POSTGRES_DB: knowflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowflow -d knowflow"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: knowflow-minio:source
    build:
      context: ..
      dockerfile: deploy/Dockerfile.minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
  bucket:
    image: knowflow-backend:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      S3_BUCKET: knowflow
    depends_on:
      minio: { condition: service_healthy }
    command: [".venv/bin/python", "-m", "common.init_bucket"]
    restart: "no"
  migrate:
    <<: *backend
    environment:
      <<: *environment
      DATABASE_URL: postgres://knowflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/knowflow
    command: ["uv", "run", "--no-sync", "python", "manage.py", "migrate", "--noinput"]
    restart: "no"
  backend:
    <<: *backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      bucket: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 8s
      retries: 5
  worker:
    <<: *backend
    command: ["uv", "run", "--no-sync", "celery", "-A", "config", "worker", "-Q", "documents,evaluation,celery", "--concurrency=2", "-l", "INFO"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", ".venv/bin/celery -A config inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
  scheduler:
    <<: *backend
    command: ["uv", "run", "--no-sync", "celery", "-A", "config", "beat", "-s", "/tmp/celerybeat-schedule", "-l", "INFO"]
    depends_on:
      backend: { condition: service_healthy }
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports: ["8080:80"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  minio_data:
