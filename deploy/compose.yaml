name: knowflow
x-backend: &backend
  image: knowflow-backend:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile.backend
  environment: &environment
    DJANGO_SETTINGS_MODULE: config.settings.prod
    DEBUG: "false"
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-true}
    AI_PROVIDER: ${AI_PROVIDER:-demo}
    AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
    AI_API_KEY: ${AI_API_KEY:-}
    AI_MODEL: ${AI_MODEL:-}
    AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
    EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-demo}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-demo-hash-v1}
    EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-128}
    MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-3}
    AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-4}
    AGENT_TOOL_TIMEOUT_SECONDS: ${AGENT_TOOL_TIMEOUT_SECONDS:-10}
    AGENT_TOTAL_TIMEOUT_SECONDS: ${AGENT_TOTAL_TIMEOUT_SECONDS:-60}
    AGENT_TOKEN_BUDGET: ${AGENT_TOKEN_BUDGET:-32000}
    AGENT_EVIDENCE_BYTES: ${AGENT_EVIDENCE_BYTES:-6000}
    AGENT_OUTPUT_BYTES: ${AGENT_OUTPUT_BYTES:-16000}
    PARSER_TIMEOUT_SECONDS: ${PARSER_TIMEOUT_SECONDS:-15}
    PARSER_CPU_SECONDS: ${PARSER_CPU_SECONDS:-10}
    PARSER_MEMORY_MB: ${PARSER_MEMORY_MB:-512}
    PARSER_OUTPUT_BYTES: ${PARSER_OUTPUT_BYTES:-16777216}
    CLEANUP_STORAGE_ENABLED: ${CLEANUP_STORAGE_ENABLED:-false}
    CLEANUP_STORAGE_GRACE_DAYS: ${CLEANUP_STORAGE_GRACE_DAYS:-7}
    PYTHONDONTWRITEBYTECODE: "1"
    UV_CACHE_DIR: /tmp/uv-cache
    GENERATION_PROVIDER: ${GENERATION_PROVIDER:-}
    GENERATION_BASE_URL: ${GENERATION_BASE_URL:-}
    GENERATION_API_KEY: ${GENERATION_API_KEY:-}
    GENERATION_MODEL: ${GENERATION_MODEL:-}
    GENERATION_AUTH_REQUIRED: ${GENERATION_AUTH_REQUIRED:-true}
    GENERATION_TOKEN_PARAMETER: ${GENERATION_TOKEN_PARAMETER:-max_completion_tokens}
    GENERATION_TIMEOUT_SECONDS: ${GENERATION_TIMEOUT_SECONDS:-60}
    GENERATION_CONTEXT_WINDOW: ${GENERATION_CONTEXT_WINDOW:-16384}
    GENERATION_INPUT_BUDGET: ${GENERATION_INPUT_BUDGET:-12000}
    GENERATION_HISTORY_BUDGET: ${GENERATION_HISTORY_BUDGET:-2000}
    GENERATION_MAX_OUTPUT_TOKENS: ${GENERATION_MAX_OUTPUT_TOKENS:-800}
    EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
    EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
    EMBEDDING_AUTH_REQUIRED: ${EMBEDDING_AUTH_REQUIRED:-true}
    EMBEDDING_SEND_DIMENSIONS: ${EMBEDDING_SEND_DIMENSIONS:-false}
    EMBEDDING_PROFILE_VERSION: ${EMBEDDING_PROFILE_VERSION:-v1}
    EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-45}
    EMBEDDING_MAX_INPUT_TOKENS: ${EMBEDDING_MAX_INPUT_TOKENS:-8192}
    MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-2}
    MODEL_RETRY_MAX_DELAY_SECONDS: ${MODEL_RETRY_MAX_DELAY_SECONDS:-2}
    DEFAULT_TENANT_DAILY_TOKENS: ${DEFAULT_TENANT_DAILY_TOKENS:-1000000}
    DEFAULT_USER_DAILY_TOKENS: ${DEFAULT_USER_DAILY_TOKENS:-100000}
    MODEL_PRICE_VERSION: ${MODEL_PRICE_VERSION:-unpriced}
    GENERATION_INPUT_USD_PER_MILLION: ${GENERATION_INPUT_USD_PER_MILLION:-}
    GENERATION_OUTPUT_USD_PER_MILLION: ${GENERATION_OUTPUT_USD_PER_MILLION:-}
    EMBEDDING_USD_PER_MILLION: ${EMBEDDING_USD_PER_MILLION:-}
    RETRIEVAL_RERANK_ENABLED: ${RETRIEVAL_RERANK_ENABLED:-false}
    RETRIEVAL_REWRITE_ENABLED: ${RETRIEVAL_REWRITE_ENABLED:-false}
    RETRIEVAL_VECTOR_INDEX: ${RETRIEVAL_VECTOR_INDEX:-exact}
    REWRITE_PROVIDER: ${REWRITE_PROVIDER:-rules}
    RERANKER_PROVIDER: ${RERANKER_PROVIDER:-lexical}
    RERANKER_BASE_URL: ${RERANKER_BASE_URL:-}
    RERANKER_API_KEY: ${RERANKER_API_KEY:-}
    RERANKER_MODEL: ${RERANKER_MODEL:-lexical-overlap-v1}
    RERANKER_AUTH_REQUIRED: ${RERANKER_AUTH_REQUIRED:-true}
    RERANKER_TIMEOUT_SECONDS: ${RERANKER_TIMEOUT_SECONDS:-10}
    RERANKER_MAX_CHARS: ${RERANKER_MAX_CHARS:-2400}
    RERANKER_MAX_INPUT_TOKENS: ${RERANKER_MAX_INPUT_TOKENS:-64000}
    RERANKER_USD_PER_MILLION: ${RERANKER_USD_PER_MILLION:-}
    CODE_REVISION: ${CODE_REVISION:-workspace}
    DATABASE_URL: postgres://knowflow_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}@postgres:5432/knowflow
    REDIS_URL: redis://redis:6379/0
    CELERY_TASK_ALWAYS_EAGER: "false"
    S3_ENABLED: "true"
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    bucket: { condition: service_completed_successfully }
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:size=256m,mode=1777"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  mem_limit: 2g

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    environment:
      POSTGRES_USER: knowflow
      POSTGRES_DB: knowflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowflow -d knowflow"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: knowflow-minio:source
    build:
      context: ..
      dockerfile: deploy/Dockerfile.minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
  bucket:
    image: knowflow-backend:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      S3_BUCKET: knowflow
    depends_on:
      minio: { condition: service_healthy }
    command: [".venv/bin/python", "-m", "common.init_bucket"]
    restart: "no"
  migrate:
    <<: *backend
    environment:
      <<: *environment
      DATABASE_URL: postgres://knowflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/knowflow
    command: ["uv", "run", "--no-sync", "python", "manage.py", "migrate", "--noinput"]
    restart: "no"
  backend:
    <<: *backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      bucket: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 8s
      retries: 5
  worker:
    <<: *backend
    command: ["uv", "run", "--no-sync", "celery", "-A", "config", "worker", "-Q", "documents,evaluation,celery", "--concurrency=2", "-l", "INFO"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", ".venv/bin/celery -A config inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
  scheduler:
    <<: *backend
    command: ["uv", "run", "--no-sync", "celery", "-A", "config", "beat", "-s", "/tmp/celerybeat-schedule", "-l", "INFO"]
    depends_on:
      backend: { condition: service_healthy }
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports: ["${HTTP_PORT:-8080}:80"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  minio_data:
