name: knowflow
x-backend: &backend
  build:
    context: ..
    dockerfile: deploy/Dockerfile.backend
  env_file: ../.env
  environment: &environment
    DJANGO_SETTINGS_MODULE: config.settings.prod
    DEBUG: "false"
    DATABASE_URL: postgres://knowflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/knowflow
    REDIS_URL: redis://redis:6379/0
    CELERY_TASK_ALWAYS_EAGER: "false"
    S3_ENABLED: "true"
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    bucket: { condition: service_completed_successfully }
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: knowflow
      POSTGRES_DB: knowflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowflow -d knowflow"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes: ["minio_data:/data"]
  bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done;
        mc mb --ignore-existing local/knowflow
    restart: "no"
  migrate:
    <<: *backend
    command: ["uv", "run", "--no-sync", "python", "manage.py", "migrate", "--noinput"]
    restart: "no"
  backend:
    <<: *backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      bucket: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 8s
      retries: 5
  worker:
    <<: *backend
    command: ["uv", "run", "--no-sync", "celery", "-A", "config", "worker", "-Q", "documents,evaluation,celery", "--concurrency=2", "-l", "INFO"]
    depends_on:
      backend: { condition: service_healthy }
  scheduler:
    <<: *backend
    command: ["uv", "run", "--no-sync", "celery", "-A", "config", "beat", "-s", "/tmp/celerybeat-schedule", "-l", "INFO"]
    depends_on:
      backend: { condition: service_healthy }
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports: ["8080:80"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  minio_data:
